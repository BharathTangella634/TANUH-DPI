auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  # ── Durable storage (GCS) ───────────────────────────────────────────────────
  # Bucket: gs://dpi-monitoring-bkt (asia-south1, already created).
  # No credentials configured here on purpose — Loki picks up Application
  # Default Credentials from the VM's attached service account automatically,
  # same keyless pattern already used by cloud-sql-proxy and the app services'
  # own GCS access (see docker-compose.prod.yml GCS_BUCKET usage). That service
  # account needs roles/storage.objectAdmin on this bucket (see plan doc for
  # the exact gcloud command).
  storage:
    gcs:
      bucket_name: dpi-monitoring-bkt

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: gcs
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
    cache_ttl: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: gcs

limits_config:
  retention_period: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
