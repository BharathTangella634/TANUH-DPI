global:
  external_labels:
    cluster: dpi-prod
    region: asia-south1
  scrape_interval: 15s
  evaluation_interval: 15s

# ── Alertmanager integration (Phase 4) ───────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ── Alert rule files (Phase 4) ────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ── Monitoring infrastructure (fixed, colocated with Prometheus itself) ────
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # ── Everything that runs per-VM (autoscale-ready) ──────────────────────────
  # The dpi-mig instance group can have any number of VMs. target-discovery
  # (monitoring/target-discovery/) polls the GCE API every 30s and writes the
  # current, real target list here — Prometheus picks up file changes
  # automatically, no restart needed. Each target group in that file already
  # carries the correct "job" label, so no relabeling is needed here.
  #
  # Jobs produced by this file (see discover_targets.py for the exact ports):
  #   pdf2abdm, pdf2nhcx, session_logger, privacy_filter, forgensic,
  #   node_exporter, queue_exporter,
  #   celery_abdm_workers, celery_nhcx_workers, celery_forgensic_workers
  - job_name: dpi-autodiscovered
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/targets.json
        refresh_interval: 30s
    metrics_path: /metrics
