server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  # Was http://loki:3100/... (Docker-internal name — only worked because
  # Promtail used to be colocated with Loki on the same VM). Promtail now runs
  # on every VM in dpi-mig, so it needs Loki's real, reachable address.
  # Requires the -config.expand-env=true flag (set on the promtail command in
  # docker-compose.yml) and the LOKI_HOST env var pointing at the monitoring
  # VM's internal IP.
  - url: http://${LOKI_HOST}:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    pipeline_stages:
      - docker: {}

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service

      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project

      - source_labels: ['__meta_docker_container_id']
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
